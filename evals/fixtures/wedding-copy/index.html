<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alex &amp; Sam — Our wedding</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, serif; color: #26382d; background: #f8f5ed; }
    body { margin: 0; }
    main { max-width: 780px; margin: 5rem auto; padding: 2rem; }
    .eyebrow { font: 0.8rem system-ui; letter-spacing: .16em; text-transform: uppercase; }
    h1 { font-size: clamp(3rem, 9vw, 5.5rem); font-weight: 400; margin: 1rem 0; }
    .intro { max-width: 35rem; font-size: 1.2rem; line-height: 1.7; }
    .schedule-link { display: inline-block; background: #294f3c; color: white; padding: 1rem 1.5rem; margin: 1rem 0 3rem; border-radius: 4px; font: 1rem system-ui; text-decoration: none; }
    .schedule-link:focus-visible { outline: 3px solid #bd8628; outline-offset: 4px; }
    #schedule { border-top: 1px solid #cbd4c8; padding-top: 1.5rem; }
    li { line-height: 2; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Saturday, 12 June 2027 · Garden House</p>
    <h1>Alex &amp; Sam</h1>
    <p class="intro">We’re getting married, and we can’t wait to celebrate with you. Find the plan for our day below.</p>
    <a class="schedule-link" href="#schedule">Details</a>
    <section id="schedule" aria-labelledby="schedule-title">
      <h2 id="schedule-title">The wedding schedule</h2>
      <ul><li>15:00 — Ceremony in the garden</li><li>16:00 — Drinks and photographs</li><li>18:00 — Dinner and dancing</li></ul>
    </section>
  </main>
</body>
</html>
